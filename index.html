.btn.sg{background:#1F7A4A;color:#fff}.btn.so{background:#F0A63C;color:#0E2A38}.btn.sr{background:#C8372D;color:#fff}

+'<div class="card"><label class="f">Filter type<select class="in" data-b="equip.filter" data-t="s"><option value="sand"'+(e.filter==='sand'?' selected':'')+'>Sand filter with multiport valve</option><option value="cartridge"'+(e.filter==='cartridge'?' selected':'')+'>Cartridge filter</option></select></label><label class="f">Pump'+inp('equip.pump',e.pump,{text:1,ph:'model'})+'</label><label class="f">Salt chlorinator'+inp('equip.chlor',e.chlor,{text:1,ph:'model'})+'</label></div>'
+(/sscmini/i.test(e.chlor)?'<span class="note">Emaux SSCmini: salt 3000–4000 ppm (4 kg per m³ gives 4000). It makes no chlorine in water below 10 °C and is rated for pools up to 90 m³.</span>':'')
+syncCard()
+'<div class="card"><div class="row"><span class="b">Backup</span><span class="sm">'+(S.lastBackup?'Last backup '+dstr(S.lastBackup,{day:'numeric',month:'short'}):'No backup yet')+'</span></div><div class="row"><button class="btn grow" data-a="export">Export to a file</button><button class="btn o grow" data-a="restore">Restore</button></div><span class="sm">Saves all tests, settings and pool dimensions. Your data is stored only on this phone, so export now and then.</span><input type="file" id="rfile" accept=".json,application/json" hidden></div>'};

const TABS=[['today','Today','drop'],['maint','Maintenance','tool'],['history','History','chart'],['pool','Pool','pool'],['rem','Reminders','bell']];
const PARENT={guide:'maint',log:'today',settings:'today',dims:'pool',chem:'pool',equip:'pool'};
function render(){document.getElementById('app').innerHTML=(V[view]||V.today)();const cur=PARENT[view]?(view==='guide'?'maint':view==='log'?'today':ui.from||PARENT[view]):view;document.getElementById('tabs').innerHTML='<div>'+TABS.map(t=>'<button data-a="go" data-v="'+t[0]+'"'+(cur===t[0]?' aria-current="page"':'')+'>'+ic(t[2])+t[1]+'</button>').join('')+'</div>';if(ui.quick&&view==='today'){const q=document.getElementById('q_in');if(q)q.focus()}}
function go(v){view=v;render();window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='q_in'){e.preventDefault();A.quickSave()}});
function toast(msg,canUndo){const el=document.getElementById('toast');el.innerHTML='<span>'+esc(msg)+'</span>'+(canUndo?'<button data-a="undo">Undo</button>':'');el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),canUndo?7000:3000)}
function snap(){undoSnap=JSON.stringify(S)}
function setPath(o,path,v){const ks=path.split('.');for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
function shareFile(name,type,text){const blob=new Blob([text],{type});try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function buildICS(){const p=n=>String(n).padStart(2,'0'),f=t=>{const d=new Date(t);return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'},stamp=f(Date.now()),ev=(sum,start,days,desc)=>['BEGIN:VEVENT','UID:'+uid()+uid()+'@mypool','DTSTAMP:'+stamp,'DTSTART:'+f(start),'DURATION:PT15M','RRULE:'+(days==='Y'?'FREQ=YEARLY':'FREQ=DAILY;INTERVAL='+Math.max(1,Math.round(days))),'SUMMARY:'+sum,'DESCRIPTION:'+desc,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+sum,'TRIGGER:PT0M','END:VALARM','END:VEVENT'];
let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Pool//EN'];out=out.concat(ev('Pool: test the water',Math.max(nextCheck(),Date.now()+6e4),S.rem[S.season].days||7,'Open My Pool and log chlorine and pH.'));
const md=monthlyDue();if(md)out=out.concat(ev('Pool: monthly full test',Math.max(md.due,Date.now()+6e4),30,active('monthly').map(t=>t.name).join('\\, ')));
for(const k of S.tasks){if(!k.on||(k.season&&k.season!==S.season))continue;const d=new Date(Math.max(taskDue(k)??Date.now(),Date.now()));d.setHours(9,0,0,0);if(d.getTime()<Date.now())d.setTime(d.getTime()+DAY);out=out.concat(ev('Pool: '+k.name.replace(/,/g,'\\,'),d.getTime(),k.days||7,'See Maintenance in My Pool for the steps.'))}
if(S.auto.on)for(const k of['summer','winter']){const[m,d]=String(S.auto[k]).split('-').map(Number),n=new Date();let t=new Date(n.getFullYear(),m-1,d,9).getTime();if(t<Date.now())t=new Date(n.getFullYear()+1,m-1,d,9).getTime();out=out.concat(ev('Pool: '+k+' mode starts',t,'Y','My Pool switches to '+k+' mode today. Open it and add the reminders to the calendar again.'))}
out.push('END:VCALENDAR');return out.join('\r\n')}

const A={

snap();const le={t:Date.now(),v,added,note:draft.note.trim(),season:S.season};if(draft.pr!=null){le.pr=draft.pr;S.equip.pressures.push({t:le.t,v:draft.pr});if(S.equip.pressures.length>200)S.equip.pressures.shift()}S.logs.push(le);for(const a of added){const p=S.products.find(x=>x.id===a.pid);if(p&&p.stock!=null)p.stock=Math.max(0,Math.round((p.stock-a.amt/1000)*1000)/1000)}
S.rem.extra=added.length&&S.rem.retest?tomorrowAt():null;draft=null;ui.full=false;save();go('today');toast('Test saved',1)},

addStep:()=>{S.dims.steps.push({name:'Shape '+(S.dims.steps.filter(x=>x.on==='floor').length+1),part:true,on:'floor',len:null,dep:null,h:null});save();render()},
delStep:el=>{snap();S.dims.steps.splice(+el.dataset.id,1);save();render();toast('Step removed',1)},
autoOn:()=>{S.auto.on=!S.auto.on;S.auto.key=null;applyAuto();save();render()},
side:el=>{S.dims.side=el.dataset.val;save();render()},
posReset:()=>{snap();S.dims.skimPos=[];S.dims.jetPos=[];save();render();toast('Spaced evenly',1)},
skimSide:el=>{S.dims.skimSide=el.dataset.val;save();render()},
jetDir:el=>{S.dims.jetDir=el.dataset.val;save();render()},
gStart:el=>{ui.guide={id:el.dataset.id,i:0};gInit(ui.guide);go('guide')},
gNext:()=>{stopAlarm();letSleep();ui.guide.i++;gInit(ui.guide);render();window.scrollTo(0,0)},
gPrev:()=>{stopAlarm();letSleep();if(ui.guide.i>0){ui.guide.i--;gInit(ui.guide);render()}},
gSound:()=>{audioOn();beep(880,0,.2,.35);beep(660,.25,.2,.35)},
gTimer:()=>{const g=ui.guide;audioOn();stopAlarm();if(g.run){g.left=Math.max(0,Math.ceil((g.end-Date.now())/1000));g.run=false;letSleep();beep(520,0,.12,.3);beep(390,.14,.18,.3)}else{beep(520,0,.1,.3);beep(660,.12,.1,.3);beep(880,.24,.16,.3);if(g.done||g.left<=0){g.left=g.total;g.done=false}g.end=Date.now()+g.left*1000;g.run=true;keepAwake()}render()},
gAdd:()=>{stopAlarm();const g=ui.guide;g.left+=30;g.total=Math.max(g.total,g.left);g.done=false;if(g.run)g.end+=30000;render()},
gReset:()=>{stopAlarm();letSleep();gInit(ui.guide);render()},
gFinish:()=>{stopAlarm();snap();const k=S.tasks.find(x=>x.id===ui.guide.id),pe=document.getElementById('g_pr'),pv=pe?num(pe.value):null;if(pv!=null){S.equip.pressures.push({t:Date.now(),v:pv});if(S.equip.clean==null)S.equip.clean=pv}k.last=Date.now();save();ui.guide=null;ui.task=null;letSleep();go('maint');toast('Marked as done',1)},
syncConnect:async()=>{if(ui.syncBusy)return;if(!C.owner.trim()||!C.repo.trim()||!C.token.trim()){C.err='Fill in the username, the repository and the token.';render();return}ui.syncBusy=true;C.err='';C.sha=null;render();try{const rem=await ghGet();if(rem){C.sha=rem.sha;ui.syncAsk=rem.data}else{await ghPut();C.on=true;C.last=Date.now();toast('Connected. Data saved to GitHub')}}catch(e){C.err=e.conflict?'Could not save to GitHub. Try again.':/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'No connection to GitHub.':e.message}ui.syncBusy=false;saveC();render()},
syncUseRemote:()=>{const d=ui.syncAsk;ui.syncAsk=null;snap();C.on=true;C.last=Date.now();C.err='';adopt(d);saveC();render();toast('Loaded the data from GitHub',1)},

punit:el=>{snap();setUnit(el.dataset.val);save();render();toast('Pressure shown in '+pu(),1)},
quick:el=>{ui.quick=el.dataset.id;render()},

quickSave:()=>{const id=ui.quick,v=num((document.getElementById('q_in')||{}).value);if(!id)return;if(v==null){toast('Type the reading first');return}snap();const now=Date.now();let l=S.logs[S.logs.length-1];if(!l||now-l.t>15*60000){l={t:now,v:{},added:[],note:'',season:S.season};S.logs.push(l)}if(id==='pr'){const q=S.equip.pressures.find(x=>x.t===l.t);if(q)q.v=v;else{S.equip.pressures.push({t:l.t,v});S.equip.pressures.sort((a,b)=>a.t-b.t)}l.pr=v}else{l.v[id]=v;if(l.fix)l.fix=l.fix.filter(x=>x!==id)}S.rem.extra=null;ui.quick=null;save();render();toast('Saved',1)},
pushOn:async()=>{ui.pushMsg='';let perm;try{perm=await Notification.requestPermission()}catch(e){perm='denied'}if(perm!=='granted'){ui.pushMsg='Notifications are blocked for My Pool. Allow them in the phone Settings, Notifications, My Pool.';render();return}ui.pushMsg='Setting up…';render();try{await pushSetup(true);ui.pushMsg='';toast('Notifications are on')}catch(e){ui.pushMsg=(e&&e.message)||'Could not turn on notifications.'}render()},
pushOff:async()=>{ui.pushMsg='';try{await pushSetup(false);toast('Notifications are off on this device')}catch(e){ui.pushMsg=(e&&e.message)||'Could not update GitHub.'}render()},
didFix:el=>{snap();const id=el.dataset.id,now=Date.now();let l=S.logs[S.logs.length-1];if(!l||now-l.t>15*60000){l={t:now,v:{},added:[],note:'',season:S.season};S.logs.push(l)}l.fix=(l.fix||[]).filter(x=>x!==id).concat(id);save();render();toast('Recorded as added',1)},
didAdd:el=>{snap();const pid=el.dataset.pid,amt=+el.dataset.amt,now=Date.now();let l=S.logs[S.logs.length-1];if(!l||now-l.t>15*60000){l={t:now,v:{},added:[],note:'',season:S.season};S.logs.push(l)}l.added=l.added||[];l.added.push({pid,amt});const q=S.products.find(x=>x.id===pid);if(q&&q.stock!=null)q.stock=Math.max(0,Math.round((q.stock-amt/1000)*1000)/1000);save();render();toast('Recorded: '+amt+' added',1)},

addTask:()=>{const n=document.getElementById('nk_name').value.trim(),d=num(document.getElementById('nk_days').value);if(!n||!d||d<1){toast('Type a name and how many days');return}S.tasks.push({id:'k'+uid(),name:n,days:Math.round(d),last:null,on:true,custom:true});save();render()},

let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest?e.target.closest('.drg'):null;if(!g)return;drag={g,k:g.ownerSVGElement.getBoundingClientRect().width/350,sx:e.clientX,x:+g.dataset.x,dx:0};try{g.setPointerCapture(e.pointerId)}catch(x){}e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;const g=drag.g,nx=Math.max(+g.dataset.min,Math.min(+g.dataset.max,drag.x+(e.clientX-drag.sx)/drag.k));drag.dx=nx-drag.x;g.setAttribute('transform','translate('+drag.dx+' 0)')});
function endDrag(){if(!drag)return;const g=drag.g,dx=drag.dx,x=drag.x;drag=null;if(Math.abs(dx)<0.5)return;ensurePos();S.dims[g.dataset.drag==='skim'?'skimPos':'jetPos'][+g.dataset.i]=Math.round((x+dx-(+g.dataset.x0))/(+g.dataset.sc)*100);save();render()}

document.addEventListener('mousemove',e=>{if(!drag||e.buttons===0)return;const g=drag.g,nx=Math.max(+g.dataset.min,Math.min(+g.dataset.max,drag.x+(e.clientX-drag.sx)/drag.k));drag.dx=nx-drag.x;g.setAttribute('transform','translate('+drag.dx+' 0)')});

document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);

if(d.c){C[d.c]=el.value;ui.syncAsk=null;saveC();return}

if(d.cnt){const n=num(el.value);S.dims[d.cnt]=n==null?0:Math.max(0,Math.min(8,Math.round(n)));ensurePos();save();render();return}

if(el.id==='rfile'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.logs)||!Array.isArray(o.tests))throw 0;snap();mem=o;try{localStorage.setItem(KEY,JSON.stringify(o))}catch(x){}S=load();render();toast('Backup restored',1)}catch(x){toast('That file is not a My Pool backup')}};r.readAsText(el.files[0])}});
{const sw=applyAuto();render();if(sw)toast('Switched to '+sw+' mode')}

syncNow();
setTimeout(()=>document.getElementById('splash').classList.add('off'),900);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
