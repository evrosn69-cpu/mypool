<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Pool</title>
<meta name="theme-color" content="#0B6E8A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Pool">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#F2F7F9;color:#0E2A38;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100vh}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em}
h2{margin:4px 0 0;font-size:13px;font-weight:600;color:#456170}
.sub{font-size:13px;color:#456170}
.sm{font-size:12px;color:#456170}
.b{font-weight:600}
.card{background:#fff;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.card.sel{border:2px solid #0B6E8A;padding:12px 14px}
.card.np{padding:0;overflow:hidden;gap:0}
.card.warn{background:#FFF3E8;border:1px solid #F3C79C}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.grow{flex:1;min-width:0}
.list{background:#fff;border-radius:16px;padding:2px 16px;display:flex;flex-direction:column}
.list>*{min-height:54px;border-bottom:1px solid #E3ECF0;padding:6px 0}
.list>*:last-child{border-bottom:0}
.btn{min-height:44px;padding:0 16px;border:0;border-radius:12px;background:#0B6E8A;color:#fff;font-size:15px;font-weight:600}
.btn.o{background:transparent;border:1px solid #0B6E8A;color:#0B6E8A}
.btn.w{background:#fff;color:#0E2A38}
.btn.big{min-height:52px;font-size:16px}
.btn.x{min-height:44px;min-width:44px;padding:0;background:transparent;color:#456170;font-size:20px}
.lnk{align-self:flex-start;min-height:44px;padding:0;border:0;background:transparent;color:#0B6E8A;font-size:14px;font-weight:600}
.ico{width:44px;height:44px;border:0;border-radius:12px;background:#DCE8ED;display:flex;align-items:center;justify-content:center}
.seg{display:flex;background:#DCE8ED;border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:#33505E;font-size:14px;font-weight:500;padding:0 6px}
.seg button[aria-pressed=true]{background:#fff;color:#0E2A38;font-weight:600}
.seg.s{border-radius:10px;padding:3px;gap:2px}
.seg.s button{min-height:38px;font-size:12px;flex:0 0 auto;min-width:48px}
.chip{font-size:12px;font-weight:600;border-radius:8px;padding:4px 8px;white-space:nowrap;color:#084F64;background:#D6ECF3}
.chip.warn{color:#8A3B00;background:#FFE4CC}
.in{width:100%;height:44px;border:1px solid #B9CCD5;border-radius:10px;padding:0 10px;font-size:16px;font-weight:600;background:#fff;min-width:0}
.in.r{text-align:right}
.in.big{height:48px;font-size:22px;font-weight:700;width:104px}
select.in{font-weight:500;padding-right:4px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#456170;flex:1;min-width:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;gap:8px;padding:14px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.g{position:relative;display:flex;height:10px;gap:2px;margin:5px 0}
.g i{display:block;height:10px}
.g i.w{background:#F3C79C}.g i.k{background:#0B6E8A}
.g i:first-child{border-radius:5px 0 0 5px}.g i:nth-child(3){border-radius:0 5px 5px 0}
.g b{position:absolute;top:-5px;width:10px;height:20px;margin-left:-5px;background:#0E2A38;border:2px solid #fff;border-radius:5px}
.bar{height:8px;border-radius:4px;background:#DCE8ED;overflow:hidden}
.bar i{display:block;height:8px;border-radius:4px;background:#0B6E8A}
.bar i.low{background:#B4500A}
.sw{display:flex;gap:4px}
.sw button{flex:1;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;color:#456170;font-size:12px;font-weight:500;min-height:52px}
.sw button span{display:block;width:100%;height:32px;border-radius:8px}
.sw button[aria-pressed=true]{color:#0E2A38;font-weight:700}
.sw button[aria-pressed=true] span{border:2px solid #fff;outline:3px solid #0E2A38}
.wk{display:flex;justify-content:space-between}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:#456170}
.wk span{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;color:#0E2A38}
.wk span.c{background:#0B6E8A;color:#fff;font-weight:700}
.wk span.e{background:#FFE4CC;color:#8A3B00}
.sw-t{position:relative;width:52px;height:44px;flex:none;border:0;background:transparent;padding:0}
.sw-t i{display:block;width:52px;height:30px;border-radius:15px;background:#8FA5AF;position:relative}
.sw-t i:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.sw-t[aria-checked=true] i{background:#0B6E8A}
.sw-t[aria-checked=true] i:after{left:25px}
ol.st{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
ol.st li{display:flex;gap:10px;font-size:14px;align-items:flex-start;counter-increment:s}
ol.st li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:12px;background:#D6ECF3;color:#084F64;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.note{font-size:12px;color:#084F64;background:#D6ECF3;border-radius:10px;padding:8px 10px}
.tbl{display:grid;gap:8px;align-items:center}
svg.pl{display:block;width:100%;height:auto}
#tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #DCE8ED;display:flex;justify-content:center;padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}
#tabs div{display:flex;width:100%;max-width:480px}
#tabs button{flex:1;height:52px;border:0;background:transparent;color:#456170;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#tabs button[aria-current=page]{color:#0B6E8A;font-weight:600}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));max-width:448px;margin:0 auto;background:#0E2A38;color:#fff;border-radius:12px;padding:6px 6px 6px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;z-index:6;font-size:14px}
#toast.on{display:flex}
#toast button{min-height:40px;border:0;border-radius:8px;background:#fff;color:#0E2A38;font-weight:600;padding:0 14px}
#splash{position:fixed;inset:0;background:#0B6E8A;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9;transition:opacity .4s;overflow:hidden}
#splash.off{opacity:0;pointer-events:none}
#splash h1{font-size:38px}
#splash svg.wv{position:absolute;left:0;bottom:0;width:100%;height:200px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" aria-label="Main"></nav>
<div id="toast" role="status"></div>
<div id="splash"><svg role="img" aria-label="My Pool" viewBox="60 110 400 320" width="230" height="184" style="margin-top:-120px"><rect x="86" y="140" width="340" height="232" rx="30" fill="#4FB3D9" stroke="#fff" stroke-width="18"/><rect x="95" y="149" width="108" height="214" rx="20" fill="#8FD0EA"/><rect x="95" y="149" width="72" height="214" rx="20" fill="#B9E3F3"/><rect x="95" y="149" width="36" height="214" rx="20" fill="#DDF2FA"/><path d="M236 214c14-10 28-10 42 0s28 10 42 0s28-10 42 0M236 262c14-10 28-10 42 0s28 10 42 0" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="10" stroke-linecap="round"/><circle cx="392" cy="356" r="64" fill="#fff" stroke="#0B6E8A" stroke-width="12"/><path d="M364 357l20 20 38-42" fill="none" stroke="#0B6E8A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>My Pool</h1><span style="color:#E4F3F8">Chlorine · pH · reminders</span><svg class="wv" aria-hidden="true" viewBox="0 0 390 200" preserveAspectRatio="none"><path d="M0 70c65-40 130-40 195 0s130 40 195 0V200H0Z" fill="#2A93B5"/><path d="M0 120c65 36 130 36 195 0s130-36 195 0V200H0Z" fill="#4FB3D9"/></svg></div>
<script>
'use strict';
const KEY='mypool.v1', DAY=864e5;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null};
const fmt=v=>v==null?'–':String(Number(Number(v).toFixed(2)));
const dstr=(t,o)=>new Date(t).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});
const tstr=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

function defaults(){return{
season:'winter',surface:'liner',
dims:{u:'cm',side:'right',L:null,W:null,PD:null,wl:null,ownVol:null,steps:[{name:'Step 1',len:null,dep:null,h:null},{name:'Step 2',len:null,dep:null,h:null},{name:'Step 3',len:null,dep:null,h:null},{name:'Small step',part:true,on:'top',len:null,dep:null,h:null}]},
tests:[
{id:'fc',name:'Free chlorine',unit:'ppm',min:1,max:3,lo:0,hi:5,freq:'always'},
{id:'ph',name:'pH',unit:'',min:7.2,max:7.6,lo:6.8,hi:8,freq:'always'},
{id:'ta',name:'Total alkalinity',unit:'ppm',min:80,max:120,lo:0,hi:200,freq:'monthly'},
{id:'cya',name:'Stabiliser (CYA)',unit:'ppm',min:30,max:50,lo:0,hi:100,freq:'monthly'},
{id:'salt',name:'Salt',unit:'ppm',min:null,max:null,lo:0,hi:6000,freq:'monthly',season:'summer'},
{id:'temp',name:'Water temperature',unit:'°C',min:null,max:null,lo:0,hi:40,freq:'off'},
{id:'cc',name:'Combined chlorine',unit:'ppm',min:0,max:0.5,lo:0,hi:2,freq:'off'},
{id:'ch',name:'Calcium hardness',unit:'ppm',min:200,max:400,lo:0,hi:600,freq:'off'},
{id:'phos',name:'Phosphates',unit:'ppb',min:0,max:500,lo:0,hi:1000,freq:'off'}],
logs:[],
products:[
{id:'p1',name:'Dichlor powder',role:'chlorine',form:'powder',chem:'dichlor',strength:56,stock:null,full:null,low:0.5},
{id:'p2',name:'pH minus',role:'phminus',form:'powder',chem:'',strength:null,stock:null,full:null,low:0.5},
{id:'p3',name:'Pool salt',role:'salt',form:'powder',chem:'',strength:null,stock:null,full:null,low:5}],
doseProduct:'p1',
rem:{summer:{days:3,time:'18:00'},winter:{days:7,time:'10:00'},extra:null,retest:true},
tasks:[
{id:'bw',name:'Backwash the filter',days:14,last:null,on:true},
{id:'bask',name:'Empty skimmer and pump baskets',days:7,last:null,on:true,steps:['Pump off.','Empty the skimmer basket.','Empty the pump basket and check the lid seal.','Pump on. Check that water is flowing.']},
{id:'brush',name:'Brush walls and steps, vacuum',days:7,last:null,on:true,steps:['Brush the walls, steps and corners towards the floor.','Vacuum the floor slowly.','Empty the baskets afterwards.']},
{id:'level',name:'Check water level',days:7,last:null,on:true,steps:['The water should be about halfway up the skimmer opening.','Top up with the hose if it is low.','After heavy rain, lower it by backwashing a little longer.']},
{id:'cell',name:'Inspect and clean salt cell',days:90,last:null,on:true,season:'summer',steps:['Switch off the chlorinator and the pump.','Look at the plates for white scale.','If scaled, soak in cell cleaner as the manual says. Never scrape with metal.','Refit and check for leaks.']}],
auto:{on:true,summer:'05-01',winter:'11-01',key:null},
equip:{clean:null,delta:0.5,pressures:[],pumpS:null,pumpW:null,filter:'sand',pump:'',chlor:''},
lastBackup:null}}

let mem=null;
function load(){let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s)s=mem;const d=defaults();if(!s)return d;
if(s.dims&&s.dims.PD===undefined){const q=s.dims;q.PD=q.D??null;q.gap=null;delete q.D;const f=q.steps.filter(st=>!st.part&&st.len==null);if(f.length&&f.every(st=>st.h!=null)){const H=f.map(st=>st.h);if(H.every((h,i)=>i===H.length-1||h>=H[i+1])){for(const st of q.steps)if((st.part||st.len!=null)&&st.h!=null&&st.h>H[0])st.h-=H[0];f.forEach((st,i)=>{st.h=H[i]-(H[i+1]||0)})}}}

if(s.dims&&s.dims.u!=='cm'){const q=s.dims,c=v=>v==null?null:Math.round(v*1000)/10,pd=q.PD,g=q.gap;q.L=c(q.L);q.W=c(q.W);q.PD=c(pd);q.wl=pd==null||g==null?null:(!Number.isInteger(g)&&g<pd?c(g):Math.round((pd*100-g)*10)/10);delete q.gap;q.u='cm'}
for(const k in d){if(s[k]===undefined)s[k]=d[k];else if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k]))for(const j in d[k])if(s[k][j]===undefined)s[k][j]=d[k][j]}return s}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),view='today',ui={period:60,hist:'fc'},draft=null,undoSnap=null,toastT=null;

/* ---------- calculations ---------- */
const test=id=>S.tests.find(t=>t.id===id);
const inSeason=t=>!t.season||t.season===S.season;
const active=f=>S.tests.filter(t=>t.freq===f&&inSeason(t));
function latest(id){for(let i=S.logs.length-1;i>=0;i--){const v=S.logs[i].v[id];if(v!=null)return{val:v,t:S.logs[i].t}}return null}
function status(t,v){if(v==null||t.min==null||t.max==null)return null;return v<t.min?['Low','warn']:v>t.max?['High','warn']:['OK','']}
const wdepth=()=>{const d=S.dims;return d.PD==null?null:Math.max(0,d.wl!=null?Math.min(d.wl,d.PD):d.PD)/100};
const fullSteps=()=>S.dims.steps.filter(st=>!st.part&&st.len==null);
function stepTops(){const f=fullSteps(),t=[];let c=0;for(let i=f.length-1;i>=0;i--){c+=(f[i].h||0)/100;t[i]=c}return t}
function stepVol(st){const d=S.dims,wd=wdepth();if(wd==null||st.dep==null||st.h==null)return 0;const dep=st.dep/100,f=fullSteps(),t=stepTops();
if(!st.part&&st.len==null)return(d.W||0)/100*dep*Math.min(t[f.indexOf(st)],wd);
if(st.len==null)return 0;const len=Math.min(st.len,d.W||st.len)/100,fl=st.on==='floor',segs=[];let c=0;f.forEach((x,i)=>{const w=(x.dep||0)/100;segs.push([c,c+w,t[i]]);c+=w});segs.push([c,Infinity,0]);
const top=(fl?0:segs[0][2])+st.h/100;let v=0;for(const[a,b,u]of segs){const hi=Math.min(b,dep);if(hi>a)v+=Math.max(0,Math.min(top,wd)-Math.min(fl?0:u,wd))*(hi-a)}return len*v}
function calcVolume(){const d=S.dims,wd=wdepth();if(d.L==null||d.W==null||wd==null)return null;let v=d.L/100*d.W/100*wd;for(const st of d.steps)v-=stepVol(st);return Math.max(0,Math.round(v*1000)/1000)}
function volume(){return S.dims.ownVol!=null?S.dims.ownVol:calcVolume()}
function nextCheck(){const r=S.rem[S.season],last=S.logs.length?S.logs[S.logs.length-1].t:null;const d=new Date(last?last+(r.days||7)*DAY:Date.now());const[h,m]=String(r.time||'10:00').split(':');d.setHours(+h||0,+m||0,0,0);let t=d.getTime();if(S.rem.extra&&S.rem.extra<t)t=S.rem.extra;return t}
function tomorrowAt(){const d=new Date(Date.now()+DAY);const[h,m]=String(S.rem[S.season].time||'10:00').split(':');d.setHours(+h||0,+m||0,0,0);return d.getTime()}
function monthlyDue(){const ts=active('monthly');if(!ts.length)return null;let last=null;for(const t of ts){const l=latest(t.id);if(l&&(last==null||l.t>last))last=l.t}return{last,due:last==null?Date.now():last+30*DAY}}
function doseProd(){return S.products.find(p=>p.id===S.doseProduct)||S.products.find(p=>p.role==='chlorine')}
function roundAmt(x){return x>=100?Math.round(x/10)*10:x>=20?Math.round(x/5)*5:Math.round(x)}
function chlorineDose(fc){const t=test('fc'),p=doseProd(),vol=volume();if(t.min==null||t.max==null)return null;const ppm=(t.min+t.max)/2-fc;if(ppm<=0)return null;if(!p||!p.strength)return{need:'Set your chlorine product and its strength in My chemicals to get a dose.'};const per=ppm*100/p.strength,u=p.form==='liquid'?'ml':'g';if(!vol)return{need:'Enter your pool dimensions to get the amount. It is about '+fmt(per)+' '+u+' of '+p.name+' for each m³ of water.'};return{amt:roundAmt(per*vol),u,p,ppm}}
function cyaEstimate(){const m=latest('cya'),vol=volume();let add=0;if(vol)for(const l of S.logs){if(m&&l.t<=m.t)continue;for(const a of l.added||[]){const p=S.products.find(x=>x.id===a.pid);if(!p||!p.strength||!a.amt)continue;const k=p.chem==='dichlor'?0.9:p.chem==='trichlor'?0.6:0;add+=a.amt*p.strength/100/vol*k}}return{base:m?m.val:null,add,est:m?m.val+add:null}}
function autoSeason(){const a=S.auto;if(!a||!a.on)return null;const now=Date.now(),y=new Date().getFullYear(),c=[];for(const yr of[y-1,y])for(const k of['summer','winter']){const[m,d]=String(a[k]).split('-').map(Number),t=new Date(yr,m-1,d).getTime();if(t<=now)c.push([t,k])}c.sort((p,q)=>q[0]-p[0]);return c.length?{season:c[0][1],key:c[0][1]+c[0][0]}:null}
function applyAuto(){const r=autoSeason();if(!r||S.auto.key===r.key)return null;S.auto.key=r.key;let sw=null;if(S.season!==r.season){S.season=r.season;S.rem.extra=null;sw=r.season}save();return sw}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const sday=k=>{const[m,d]=String(S.auto[k]).split('-').map(Number);return d+' '+MON[m-1]};
function taskDue(k){return k.last==null?null:k.last+(k.days||7)*DAY}
function dueText(t){if(t==null)return'Not done yet';const n=Math.round((new Date(t).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/DAY);return n<0?'Overdue '+(-n)+' day'+(n===-1?'':'s'):n===0?'Due today':n===1?'Due tomorrow':'Due in '+n+' days'}
function lastPressure(){const p=S.equip.pressures;return p.length?p[p.length-1]:null}
function pressureHigh(){const e=S.equip,l=lastPressure();return!!(l&&e.clean!=null&&l.v>=e.clean+(e.delta||0.5))}
function taskSteps(k){if(k.id==='bw')return S.equip.filter==='cartridge'?['Pump off. Open the filter and lift out the cartridge.','Hose it down from top to bottom, between the pleats.','Refit the cartridge and close the filter.','Pump on. Note the pressure on the gauge.']:['Pump off. Turn the valve to Backwash.','Pump on about 2 minutes, until the water runs clear.','Pump off. Valve to Rinse. Pump on 30 seconds.','Pump off. Valve back to Filter. Pump on.','Top up the pool water and note the pressure.'];return k.steps||[]}
function advice(){const out=[];if(!S.logs.length)return[{h:'Log your first test',s:'Tap "Log a test" to enter today\'s chlorine and pH.'}];
const fc=latest('fc'),ph=latest('ph'),tf=test('fc'),tp=test('ph'),vol=volume();
if(fc&&tf.min!=null){if(fc.val<tf.min){const d=chlorineDose(fc.val);if(d&&d.need)out.push({h:'Chlorine is low',s:d.need,w:1});else if(d)out.push({h:'Add about '+d.amt+' '+d.u+' of '+d.p.name,s:(S.season==='summer'?'Or raise the chlorinator output. ':'')+(d.p.form==='powder'?'Spread it over the water or dissolve it in a bucket first. ':'')+'Test again tomorrow.',w:1})}else if(fc.val>tf.max)out.push({h:'Chlorine is high',s:'Do not add more. '+(S.season==='summer'?'Lower the chlorinator output. ':'')+'It will fall by itself; test again in a day or two.',w:1})}

return s+'</svg>'}
function sideSVG(){const d=S.dims,R=d.side!=='left',L=(d.L||800)/100,PD=(d.PD||150)/100,wd=wdepth()??PD,sx=310/L,fl=100,rim=20,sy=(fl-rim)/PD,f=fullSteps(),t=stepTops(),n=f.length,known=n&&f.every(st=>st.h!=null),Y=h=>fl-Math.min(h,PD)*sy,wy=Y(wd),hs=f.map((st,i)=>known?t[i]:PD*(n-i)/(n+1)),xs=[20];let x=20;f.forEach(st=>{x+=(st.dep!=null?st.dep/100:0.3)*sx;xs.push(Math.min(x,250))});

function gauge(t,v){if(t.min==null||t.max==null)return'';const lo=Math.min(t.lo,v??t.lo),hi=Math.max(t.hi,v??t.hi),pc=x=>Math.max(0,Math.min(100,(x-lo)/(hi-lo)*100)),a=pc(t.min),b=pc(t.max);return'<span class="g"><i class="w" style="width:'+a+'%"></i><i class="k" style="width:'+(b-a)+'%"></i><i class="w" style="flex:1"></i>'+(v!=null?'<b style="left:'+pc(v)+'%"></b>':'')+'</span>'}

const TABS=[['today','Today','drop'],['log','Log','plus'],['history','History','chart'],['pool','Pool','pool'],['rem','Reminders','bell']];
const PARENT={settings:'today',dims:'pool',chem:'pool',equip:'pool',maint:'rem'};
function render(){document.getElementById('app').innerHTML=(V[view]||V.today)();const cur=PARENT[view]||view;document.getElementById('tabs').innerHTML='<div>'+TABS.map(t=>'<button data-a="go" data-v="'+t[0]+'"'+(cur===t[0]?' aria-current="page"':'')+'>'+ic(t[2])+t[1]+'</button>').join('')+'</div>'}
function go(v){view=v;render();window.scrollTo(0,0)}
function toast(msg,canUndo){const el=document.getElementById('toast');el.innerHTML='<span>'+esc(msg)+'</span>'+(canUndo?'<button data-a="undo">Undo</button>':'');el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),canUndo?7000:3000)}
function snap(){undoSnap=JSON.stringify(S)}
function setPath(o,path,v){const ks=path.split('.');for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v}
function shareFile(name,type,text){const blob=new Blob([text],{type});try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function buildICS(){const p=n=>String(n).padStart(2,'0'),f=t=>{const d=new Date(t);return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00'},stamp=f(Date.now()),ev=(sum,start,days,desc)=>['BEGIN:VEVENT','UID:'+uid()+uid()+'@mypool','DTSTAMP:'+stamp,'DTSTART:'+f(start),'DURATION:PT15M','RRULE:'+(days==='Y'?'FREQ=YEARLY':'FREQ=DAILY;INTERVAL='+Math.max(1,Math.round(days))),'SUMMARY:'+sum,'DESCRIPTION:'+desc,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+sum,'TRIGGER:PT0M','END:VALARM','END:VEVENT'];
let out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//My Pool//EN'];out=out.concat(ev('Pool: test the water',Math.max(nextCheck(),Date.now()+6e4),S.rem[S.season].days||7,'Open My Pool and log chlorine and pH.'));
const md=monthlyDue();if(md)out=out.concat(ev('Pool: monthly full test',Math.max(md.due,Date.now()+6e4),30,active('monthly').map(t=>t.name).join('\\, ')));
for(const k of S.tasks){if(!k.on||(k.season&&k.season!==S.season))continue;const d=new Date(Math.max(taskDue(k)??Date.now(),Date.now()));d.setHours(9,0,0,0);if(d.getTime()<Date.now())d.setTime(d.getTime()+DAY);out=out.concat(ev('Pool: '+k.name.replace(/,/g,'\\,'),d.getTime(),k.days||7,'See Maintenance in My Pool for the steps.'))}
if(S.auto.on)for(const k of['summer','winter']){const[m,d]=String(S.auto[k]).split('-').map(Number),n=new Date();let t=new Date(n.getFullYear(),m-1,d,9).getTime();if(t<Date.now())t=new Date(n.getFullYear()+1,m-1,d,9).getTime();out=out.concat(ev('Pool: '+k+' mode starts',t,'Y','My Pool switches to '+k+' mode today. Open it and add the reminders to the calendar again.'))}
out.push('END:VCALENDAR');return out.join('\r\n')}

undo:()=>{if(undoSnap){S=JSON.parse(undoSnap);undoSnap=null;save();render();toast('Undone')}},
freq:el=>{const t=S.tests[+el.dataset.id];t.freq=el.dataset.val;save();render()},
addTest:()=>{const n=document.getElementById('nt_name').value.trim();if(!n){toast('Type a name for the test');return}const mn=num(document.getElementById('nt_min').value),mx=num(document.getElementById('nt_max').value);S.tests.push({id:'c'+uid(),name:n,unit:document.getElementById('nt_unit').value.trim(),min:mn,max:mx,lo:mn!=null?Math.min(0,mn):0,hi:mx!=null?mx*1.6:100,freq:'always',custom:true});save();render()},
delTest:el=>{snap();S.tests.splice(+el.dataset.id,1);save();render();toast('Test removed',1)},
addStep:()=>{S.dims.steps.push({name:'Shape '+(S.dims.steps.filter(x=>x.on==='floor').length+1),part:true,on:'floor',len:null,dep:null,h:null});save();render()},
delStep:el=>{snap();S.dims.steps.splice(+el.dataset.id,1);save();render();toast('Step removed',1)},
autoOn:()=>{S.auto.on=!S.auto.on;S.auto.key=null;applyAuto();save();render()},
side:el=>{S.dims.side=el.dataset.val;save();render()},
retest:()=>{S.rem.retest=!S.rem.retest;save();render()},
taskOn:el=>{const k=S.tasks.find(k=>k.id===el.dataset.id);k.on=!k.on;save();render()},
openTask:el=>{ui.task=ui.task===el.dataset.id&&view==='maint'?null:el.dataset.id;go('maint')},
doneTask:el=>{snap();const k=S.tasks.find(k=>k.id===el.dataset.id);k.last=Date.now();save();render();toast('Marked as done',1)},
addTask:()=>{const n=document.getElementById('nk_name').value.trim(),d=num(document.getElementById('nk_days').value);if(!n||!d||d<1){toast('Type a name and how many days');return}S.tasks.push({id:'k'+uid(),name:n,days:Math.round(d),last:null,on:true,custom:true});save();render()},
delTask:el=>{snap();S.tasks=S.tasks.filter(k=>k.id!==el.dataset.id);save();render();toast('Task deleted',1)},
openProd:el=>{ui.prod=ui.prod===el.dataset.id?null:el.dataset.id;render()},
addProd:()=>{const p={id:'p'+uid(),name:'New product',role:'chlorine',form:'powder',chem:'',strength:null,stock:null,full:null,low:0.5};S.products.push(p);ui.prod=p.id;save();render()},
delProd:el=>{snap();S.products=S.products.filter(p=>p.id!==el.dataset.id);if(S.doseProduct===el.dataset.id)S.doseProduct=(S.products.find(p=>p.role==='chlorine')||{}).id||null;save();render();toast('Product deleted',1)},
useDose:el=>{S.doseProduct=el.dataset.id;save();render()},
addPressure:()=>{const v=num(document.getElementById('pr_new').value);if(v==null){toast('Type the gauge reading');return}snap();S.equip.pressures.push({t:Date.now(),v});if(S.equip.pressures.length>200)S.equip.pressures.shift();save();render();toast('Pressure saved',1)},
ics:()=>{shareFile('my-pool-reminders.ics','text/calendar',buildICS())},
export:()=>{S.lastBackup=Date.now();save();shareFile('my-pool-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json',JSON.stringify(S));render()},
restore:()=>{document.getElementById('rfile').click()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('input',e=>{const el=e.target,d=el.dataset;
if(d.d!==undefined){draft.v[d.d]=num(el.value);return}
if(d.dm!==undefined){draft.added[+d.dm].amt=num(el.value);return}
if(d.dn!==undefined){draft.note=el.value;return}
if(d.b&&el.tagName==='INPUT'&&el.type!=='time'){const v=d.t==='n'?num(el.value):el.value;setPath(S,d.b,v);if(/\.stock$/.test(d.b)){const p=S.products[+d.b.split('.')[1]];p.full=Math.max(p.full||0,v||0)}save();if(d.liveSrc)document.querySelectorAll('[data-live]').forEach(n=>{n.innerHTML=LIVE[n.dataset.live]()})}});
document.addEventListener('change',e=>{const el=e.target,d=el.dataset;
if(d.da!==undefined){draft.added[+d.da].pid=el.value;render();return}
if(d.au){const[k,f]=d.au.split('.');let[m,dd]=String(S.auto[k]).split('-').map(Number);if(f==='m')m=+el.value;else dd=+el.value;S.auto[k]=String(m).padStart(2,'0')+'-'+String(dd).padStart(2,'0');S.auto.key=null;applyAuto();save();render();return}
if(d.b&&(el.tagName==='SELECT'||el.type==='time')){setPath(S,d.b,el.value);if(d.b==='surface'){const ch=test('ch');if(ch&&el.value!=='liner'&&ch.freq==='off')ch.freq='monthly'}save();render();return}
if(el.id==='rfile'&&el.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.logs)||!Array.isArray(o.tests))throw 0;snap();mem=o;try{localStorage.setItem(KEY,JSON.stringify(o))}catch(x){}S=load();render();toast('Backup restored',1)}catch(x){toast('That file is not a My Pool backup')}};r.readAsText(el.files[0])}});
{const sw=applyAuto();render();if(sw)toast('Switched to '+sw+' mode')}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const sw=applyAuto();if(sw){render();toast('Switched to '+sw+' mode')}}});
setTimeout(()=>document.getElementById('splash').classList.add('off'),900);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
